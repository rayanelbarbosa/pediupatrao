<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Produtos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-boxes me-2 text-primary"></i>Produtos
        </h2>
        <button class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#formularioProduto"
                sec:authorize="hasRole('GERENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Produto
        </button>
    </div>

    <div class="collapse mb-3" id="formularioProduto" sec:authorize="hasRole('GERENTE')">
        <div class="card card-body">
            <form id="produtoForm">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="nome" class="form-label">Nome do produto</label>
                        <input type="text" id="nome" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label for="tipo" class="form-label">Tipo</label>
                        <select id="tipo" class="form-select" required>
                            <option value="Pizza">Pizza</option>
                            <option value="Esfiha">Esfiha</option>
                            <option value="Bebida">Bebida</option>
                            <option value="Lanche">Lanche</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="preco" class="form-label">Preço (R$)</label>
                        <input type="number" id="preco" class="form-control" step="0.01" min="0.01" required>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <div class="form-check me-3">
                            <input type="checkbox" id="ativo" class="form-check-input" checked>
                            <label for="ativo" class="form-check-label">Ativo</label>
                        </div>
                        <button type="submit" class="btn btn-success">Salvar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Nome</th>
                        <th>Tipo</th>
                        <th>Preço</th>
                        <th>Ativo</th>
                        <th class="text-end pe-4" sec:authorize="hasRole('GERENTE')">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="5" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum produto cadastrado.
                        </td>
                    </tr>
                    <tr th:each="produto : ${produtos}">
                        <td class="ps-4" th:text="${produto.nome}"></td>
                        <td th:text="${produto.tipo}"></td>
                        <td th:text="${produto.preco != null ? 'R$ ' + #numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA') : '—'}"></td>
                        <td th:text="${produto.ativo == null or produto.ativo ? 'Sim' : 'Não'}"></td>
                        <td class="text-end pe-4" sec:authorize="hasRole('GERENTE')">
                            <button type="button" class="btn btn-sm btn-outline-danger btn-excluir"
                                    th:attr="data-id=${produto.id}">
                                <i class="bi bi-trash-fill"></i> Excluir
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const formProduto = document.getElementById('produtoForm');
        if (formProduto) {
            formProduto.addEventListener('submit', async (e) => {
                e.preventDefault();
                const resultado = await chamarApi('/api/produtos', 'POST', {
                    nome: document.getElementById('nome').value,
                    tipo: document.getElementById('tipo').value,
                    preco: parseFloat(document.getElementById('preco').value),
                    ativo: document.getElementById('ativo').checked
                });
                if (resultado.ok) {
                    location.reload();
                } else {
                    alert((resultado.dados && resultado.dados.mensagem) || 'Não foi possível salvar o produto.');
                }
            });
        }

        document.querySelectorAll('.btn-excluir').forEach(botao => {
            botao.addEventListener('click', async () => {
                if (!confirm('Tem certeza que deseja excluir este produto?')) return;
                const resultado = await chamarApi('/api/produtos/' + encodeURIComponent(botao.dataset.id), 'DELETE');
                if (resultado.ok) {
                    location.reload();
                } else {
                    alert((resultado.dados && resultado.dados.mensagem) || 'Não foi possível excluir o produto.');
                }
            });
        });
    </script>

</div>

</body>
</html>
