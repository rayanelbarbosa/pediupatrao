<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="_csrf" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:content="${_csrf.headerName}">
        <title>Gerenciar Produtos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <!-- Sidebar incluído como fragmento -->
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <div class="container mt-5">
            <h1 class="mb-4">Gestão de Produtos</h1>

            <!-- Botão para abrir o formulário -->
            <button class="btn btn-primary mb-3" data-bs-toggle="collapse" data-bs-target="#formularioProduto">
                Novo Produto
            </button>

            <!-- Formulário de Cadastro -->
            <div class="collapse" id="formularioProduto">
                <div class="card card-body">
                    <form th:action="@{/api/produtos}" method="post" id="produtoForm">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome do Produto</label>
                            <input type="text" id="nome" name="nome" class="form-control" placeholder="Nome do Produto" required>
                        </div>

                        <div class="mb-3">
                            <label for="tipo" class="form-label">Tipo do Produto</label>
                            <select id="tipo" name="tipo" class="form-select" required>
                                <option value="" disabled selected>Selecione o Tipo</option>
                                <option value="Pizza">Pizza</option>
                                <option value="Lanche">Lanche</option>
                                <option value="Bebida">Bebida</option>
                                <option value="Porção">Porção</option>
                                <option value="Adicional">Adicional</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="preco" class="form-label">Preço</label>
                            <input type="number" id="preco" name="preco" class="form-control" placeholder="Preço (R$)" step="0.01" required>
                        </div>

                        <div class="form-check mb-3">
                            <input type="checkbox" id="ativo" name="ativo" class="form-check-input">
                            <label for="ativo" class="form-check-label">Produto Ativo</label>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-success">Salvar</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Listagem de Produtos -->
            <table class="table table-bordered table-striped mt-3">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Preço</th>
                        <th>Ativo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Loop para listar os produtos -->
                    <tr th:each="produto : ${produtos}">
                        <td th:text="${produto.id}"></td>
                        <td th:text="${produto.nome}"></td>
                        <td th:text="${produto.tipo}"></td>
                        <td th:text="${#numbers.formatDecimal(produto.preco, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td th:text="${produto.ativo == null or produto.ativo ? 'Sim' : 'Não'}">Sim</td>
                        <td>
                            <a th:href="@{/api/produtos/{id}(id=${produto.id})}" class="btn btn-warning btn-sm">Editar</a>
                            <button type="button" class="btn btn-danger btn-sm btn-excluir"
                                    th:attr="data-id=${produto.id}">Excluir</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <script>
            function cabecalhos() {
                const h = { 'Content-Type': 'application/json' };
                h[document.querySelector('meta[name="_csrf_header"]').content] =
                        document.querySelector('meta[name="_csrf"]').content;
                return h;
            }

            document.getElementById('produtoForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const resposta = await fetch('/api/produtos', {
                    method: 'POST',
                    headers: cabecalhos(),
                    body: JSON.stringify({
                        nome: document.getElementById('nome').value,
                        tipo: document.getElementById('tipo').value,
                        preco: parseFloat(document.getElementById('preco').value),
                        ativo: document.getElementById('ativo').checked
                    })
                });
                if (resposta.ok) {
                    location.reload();
                } else {
                    alert(resposta.status === 403 ? 'Apenas o gerente pode cadastrar produtos.' : 'Não foi possível salvar o produto.');
                }
            });

            document.querySelectorAll('.btn-excluir').forEach(botao => {
                botao.addEventListener('click', async () => {
                    if (!confirm('Tem certeza que deseja excluir este produto?')) return;
                    const h = cabecalhos();
                    const resposta = await fetch('/api/produtos/' + encodeURIComponent(botao.dataset.id), { method: 'DELETE', headers: h });
                    if (resposta.ok) {
                        location.reload();
                    } else {
                        alert(resposta.status === 403 ? 'Apenas o gerente pode excluir produtos.' : 'Não foi possível excluir o produto.');
                    }
                });
            });
        </script>
        <script th:src="@{/js/script.js}"></script>
    </body>
</html>
