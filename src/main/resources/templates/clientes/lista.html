<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Clientes</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-person-raised-hand me-2 text-primary"></i>Clientes
        </h2>
        <a href="/clientes/novo" class="btn btn-primary" sec:authorize="hasRole('ATENDENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Cliente
        </a>
    </div>

    <!-- Tabela de clientes -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Endereço</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody id="clientes-tabela">
                    <!-- Linhas carregadas via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script th:inline="javascript">
        const PODE_EDITAR = /*[[${#authorization.expression("hasRole('ATENDENTE')")}]]*/ false;
        const PODE_EXCLUIR = /*[[${#authorization.expression("hasRole('GERENTE')")}]]*/ false;
        const API_URL = '/api/clientes';
        const tabelaClientes = document.getElementById('clientes-tabela');

        function formatarEndereco(cliente) {
            const partes = [
                cliente.logradouro,
                cliente.numero,
                cliente.complemento,
                cliente.bairro,
                cliente.cidade,
                cliente.estado
            ].filter(p => p && p.trim() !== '');

            return partes.length > 0 ? partes.join(', ') : (cliente.endereco || '—');
        }

        async function carregarClientes() {
            const response = await fetch(API_URL);
            const clientes = await response.json();
            tabelaClientes.innerHTML = '';

            if (clientes.length === 0) {
                tabelaClientes.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum cliente cadastrado.
                        </td>
                    </tr>`;
                return;
            }

            clientes.forEach(cliente => {
                const row = document.createElement('tr');
                const botaoEditar = PODE_EDITAR ? `
                        <a href="/clientes/editar/${encodeURIComponent(cliente.id)}" class="btn btn-sm btn-outline-primary me-1">
                            <i class="bi bi-pencil-fill"></i> Editar
                        </a>` : '';
                const botaoExcluir = PODE_EXCLUIR ? `
                        <button class="btn btn-sm btn-outline-danger" data-id="${escaparHtml(cliente.id)}">
                            <i class="bi bi-trash-fill"></i> Excluir
                        </button>` : '';
                row.innerHTML = `
                    <td>${escaparHtml(cliente.nome) || '—'}</td>
                    <td>${escaparHtml(cliente.telefone) || '—'}</td>
                    <td>${escaparHtml(formatarEndereco(cliente))}</td>
                    <td class="text-end pe-4">${botaoEditar}${botaoExcluir}</td>
                `;
                const excluir = row.querySelector('button[data-id]');
                if (excluir) {
                    excluir.addEventListener('click', () => excluirCliente(cliente.id));
                }
                tabelaClientes.appendChild(row);
            });
        }

        async function excluirCliente(id) {
            if (confirm('Tem certeza que deseja excluir este cliente?')) {
                const resultado = await chamarApi(`${API_URL}/${encodeURIComponent(id)}`, 'DELETE');
                if (resultado.ok) {
                    alert('Cliente excluído com sucesso!');
                    carregarClientes();
                } else {
                    alert((resultado.dados && resultado.dados.mensagem) || 'Erro ao excluir o cliente.');
                }
            }
        }

        carregarClientes();
    </script>
</div>
</body>
</html>
